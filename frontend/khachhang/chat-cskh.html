<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat CSKH – Chị Ơi!</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="../shared/api.js"></script>
<style>
  body { font-family: 'Be Vietnam Pro', sans-serif; background: #f5f0eb; }
  .chat-bubble-user { background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; border-radius: 18px 18px 4px 18px; }
  .chat-bubble-admin { background: white; color: #2c1810; border-radius: 18px 18px 18px 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .ticket-card { transition: all .2s; }
  .ticket-card:hover { transform: translateX(4px); }
  .ticket-card.active { border-left: 3px solid #c0392b; background: #fff5f5; }
  #chat-messages { scrollbar-width: thin; }
  .status-OPEN { background: #fef3c7; color: #92400e; }
  .status-IN_PROGRESS { background: #dbeafe; color: #1e40af; }
  .status-RESOLVED { background: #d1fae5; color: #065f46; }
  .status-CLOSED { background: #f3f4f6; color: #6b7280; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .msg-anim { animation: fadeUp .2s ease; }
</style>
</head>
<body class="min-h-screen">

<!-- Header -->
<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="trangchu.html" class="p-2 rounded-xl hover:bg-gray-100 transition">
        <span class="material-symbols-outlined text-gray-600">arrow_back</span>
      </a>
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center">
          <span class="material-symbols-outlined text-red-600 text-[20px]">support_agent</span>
        </div>
        <div>
          <p class="font-semibold text-sm text-gray-800">Chăm sóc khách hàng</p>
          <p class="text-[11px] text-green-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span>Đang trực tuyến</p>
        </div>
      </div>
    </div>
    <button id="btn-new-ticket" class="flex items-center gap-1.5 px-4 py-2 bg-red-600 text-white rounded-xl text-sm font-semibold hover:bg-red-700 transition active:scale-95">
      <span class="material-symbols-outlined text-[16px]">add</span>Tạo yêu cầu
    </button>
  </div>
</header>

<div class="max-w-5xl mx-auto px-4 py-4 flex gap-4 h-[calc(100vh-64px)]">

  <!-- LEFT: Ticket List -->
  <div class="w-72 flex flex-col gap-3 flex-shrink-0">
    <h2 class="text-sm font-bold text-gray-700 px-1">Yêu cầu hỗ trợ</h2>
    <div id="ticket-list" class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1">
      <div class="text-center py-8 text-gray-400 text-sm" id="ticket-empty">
        <span class="material-symbols-outlined text-4xl block mb-2">inbox</span>
        Chưa có yêu cầu nào
      </div>
    </div>
  </div>

  <!-- RIGHT: Chat Window -->
  <div class="flex-1 bg-white rounded-2xl shadow-sm flex flex-col overflow-hidden border border-gray-100">
    <!-- Empty state -->
    <div id="chat-empty-state" class="flex-1 flex flex-col items-center justify-center text-gray-400 gap-3">
      <span class="material-symbols-outlined text-6xl text-red-200">chat</span>
      <p class="font-semibold text-gray-500">Chọn yêu cầu để xem hội thoại</p>
      <p class="text-sm text-gray-400">hoặc tạo yêu cầu mới để bắt đầu</p>
    </div>

    <!-- Chat area (hidden until ticket selected) -->
    <div id="chat-panel" class="hidden flex-1 flex flex-col h-full">
      <!-- Ticket info bar -->
      <div id="ticket-info-bar" class="px-4 py-3 border-b border-gray-100 flex items-center justify-between bg-gray-50">
        <div>
          <p id="ticket-subject" class="font-semibold text-sm text-gray-800"></p>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="ticket-code" class="text-[11px] text-gray-400"></span>
            <span id="ticket-status-badge" class="text-[10px] px-2 py-0.5 rounded-full font-semibold"></span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3"></div>

      <!-- Input -->
      <div class="p-3 border-t border-gray-100 flex items-end gap-2">
        <textarea id="msg-input" rows="1" placeholder="Nhập tin nhắn..." class="flex-1 resize-none px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-300 transition max-h-32 overflow-y-auto"></textarea>
        <button id="btn-send" class="w-10 h-10 bg-red-600 text-white rounded-2xl flex items-center justify-center hover:bg-red-700 transition active:scale-95 flex-shrink-0">
          <span class="material-symbols-outlined text-[20px]">send</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Tạo ticket mới -->
<div id="modal-new-ticket" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-red-600">support_agent</span>
      Tạo yêu cầu hỗ trợ
    </h3>
    <div class="flex flex-col gap-4">
      <div>
        <label class="text-xs font-semibold text-gray-600 mb-1 block">Tiêu đề <span class="text-red-500">*</span></label>
        <input id="new-subject" type="text" placeholder="Ví dụ: Tôi cần hỗ trợ về đơn hàng #DH-0012" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-200"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 mb-1 block">Mô tả chi tiết <span class="text-red-500">*</span></label>
        <textarea id="new-description" rows="4" placeholder="Mô tả vấn đề bạn gặp phải..." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-200 resize-none"></textarea>
      </div>
      <div id="create-error" class="hidden text-xs text-red-600 bg-red-50 px-3 py-2 rounded-lg"></div>
    </div>
    <div class="flex gap-3 mt-5">
      <button id="btn-cancel-modal" class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-50 transition">Hủy</button>
      <button id="btn-create-ticket" class="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-xl text-sm font-semibold hover:bg-red-700 transition active:scale-95">Gửi yêu cầu</button>
    </div>
  </div>
</div>

<script>
(async function() {
  if (!ChiOiAuth.requireAuth('dangnhap.html')) return;
  var user = ChiOiAuth.getUser();
  var currentTicketId = null;
  var pollInterval = null;

  // ─── Helpers ─────────────────────────────────────────────
  function fmtTime(dt) {
    if (!dt) return '';
    var d = new Date(dt);
    return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDate(dt) {
    if (!dt) return '';
    var d = new Date(dt);
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Hôm nay ' + fmtTime(dt);
    return d.toLocaleDateString('vi-VN') + ' ' + fmtTime(dt);
  }
  var STATUS_LABELS = { OPEN: 'Mở', IN_PROGRESS: 'Đang xử lý', RESOLVED: 'Đã giải quyết', CLOSED: 'Đã đóng' };

  // ─── Load ticket list ─────────────────────────────────────
  async function loadTickets() {
    try {
      var tickets = await apiFetch('/api/support/tickets');
      renderTicketList(tickets || []);
    } catch(e) {
      console.warn('Lỗi load tickets:', e.message);
    }
  }

  function renderTicketList(tickets) {
    var list = document.getElementById('ticket-list');
    var empty = document.getElementById('ticket-empty');
    if (!tickets.length) { empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    list.innerHTML = '';
    tickets.forEach(function(t) {
      var card = document.createElement('div');
      card.className = 'ticket-card bg-white rounded-xl p-3 cursor-pointer border border-gray-100 hover:shadow-sm' + (t.ticket_id === currentTicketId ? ' active' : '');
      card.dataset.id = t.ticket_id;
      var statusClass = 'status-' + (t.status || 'OPEN');
      card.innerHTML =
        '<div class="flex items-start justify-between gap-2 mb-1">' +
          '<p class="text-sm font-semibold text-gray-800 line-clamp-1 flex-1">' + (t.subject || '(Không tiêu đề)') + '</p>' +
          '<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold flex-shrink-0 ' + statusClass + '">' + (STATUS_LABELS[t.status] || t.status) + '</span>' +
        '</div>' +
        '<p class="text-[11px] text-gray-400">' + fmtDate(t.updated_at || t.created_at) + '</p>' +
        '<p class="text-xs text-gray-500 mt-1 line-clamp-1">' + (t.description || '') + '</p>';
      card.addEventListener('click', function() { openTicket(t); });
      list.appendChild(card);
    });
  }

  // ─── Open ticket chat ─────────────────────────────────────
  async function openTicket(ticket) {
    currentTicketId = ticket.ticket_id;
    // Update active state
    document.querySelectorAll('.ticket-card').forEach(function(c) {
      c.classList.toggle('active', parseInt(c.dataset.id) === currentTicketId);
    });

    document.getElementById('chat-empty-state').classList.add('hidden');
    document.getElementById('chat-panel').classList.remove('hidden');
    document.getElementById('chat-panel').classList.add('flex');

    // Set header
    document.getElementById('ticket-subject').textContent = ticket.subject;
    document.getElementById('ticket-code').textContent = '#' + ticket.ticket_code;
    var badge = document.getElementById('ticket-status-badge');
    badge.textContent = STATUS_LABELS[ticket.status] || ticket.status;
    badge.className = 'text-[10px] px-2 py-0.5 rounded-full font-semibold status-' + (ticket.status || 'OPEN');

    // Load messages
    await loadMessages();

    // Start polling
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(loadMessages, 5000);
  }

  async function loadMessages() {
    if (!currentTicketId) return;
    try {
      var data = await apiFetch('/api/support/tickets/' + currentTicketId);
      var msgs = (data && data.messages) || [];
      renderMessages(msgs);
    } catch(e) {
      console.warn('Lỗi load messages:', e.message);
    }
  }

  function renderMessages(msgs) {
    var area = document.getElementById('chat-messages');
    if (!msgs.length) {
      area.innerHTML = '<div class="text-center text-gray-400 text-sm py-8"><span class="material-symbols-outlined text-3xl block mb-2">chat_bubble_outline</span>Hãy gửi tin nhắn đầu tiên cho CSKH!</div>';
      return;
    }
    var scrollBottom = area.scrollTop + area.clientHeight >= area.scrollHeight - 20;
    area.innerHTML = '';
    msgs.forEach(function(msg) {
      var isMine = msg.sender_id === user.user_id;
      var senderName = (msg.users_messages_sender_idTousers && msg.users_messages_sender_idTousers.full_name) || (isMine ? 'Bạn' : 'CSKH');
      var role = msg.users_messages_sender_idTousers && msg.users_messages_sender_idTousers.role;

      var wrap = document.createElement('div');
      wrap.className = 'msg-anim flex ' + (isMine ? 'justify-end' : 'justify-start') + ' gap-2';

      if (!isMine) {
        wrap.innerHTML =
          '<div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0 self-end">' +
            '<span class="material-symbols-outlined text-red-600 text-[16px]">support_agent</span>' +
          '</div>' +
          '<div class="max-w-[75%]">' +
            '<p class="text-[10px] text-gray-400 mb-0.5 ml-1">' + senderName + '</p>' +
            '<div class="chat-bubble-admin px-4 py-2.5 text-sm">' + escHtml(msg.content) + '</div>' +
            '<p class="text-[10px] text-gray-400 mt-0.5 ml-1">' + fmtTime(msg.created_at) + '</p>' +
          '</div>';
      } else {
        wrap.innerHTML =
          '<div class="max-w-[75%]">' +
            '<div class="chat-bubble-user px-4 py-2.5 text-sm">' + escHtml(msg.content) + '</div>' +
            '<p class="text-[10px] text-gray-400 mt-0.5 text-right mr-1">' + fmtTime(msg.created_at) + ' <span class="material-symbols-outlined text-[12px] text-blue-400 align-middle">done_all</span></p>' +
          '</div>';
      }
      area.appendChild(wrap);
    });
    if (scrollBottom) area.scrollTop = area.scrollHeight;
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ─── Send message ─────────────────────────────────────────
  document.getElementById('btn-send').addEventListener('click', sendMsg);
  document.getElementById('msg-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  async function sendMsg() {
    var input = document.getElementById('msg-input');
    var content = input.value.trim();
    if (!content || !currentTicketId) return;
    input.value = '';
    input.style.height = 'auto';
    try {
      var msg = await apiFetch('/api/support/tickets/' + currentTicketId + '/messages', {
        method: 'POST',
        body: JSON.stringify({ content: content }),
      });
      // Optimistic append
      if (msg) await loadMessages();
    } catch(e) {
      console.error('Lỗi gửi tin nhắn:', e.message);
      input.value = content;
    }
  }

  // Auto-resize textarea
  document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 128) + 'px';
  });

  // ─── Modal new ticket ─────────────────────────────────────
  document.getElementById('btn-new-ticket').addEventListener('click', function() {
    document.getElementById('modal-new-ticket').classList.remove('hidden');
    document.getElementById('new-subject').focus();
    document.getElementById('create-error').classList.add('hidden');
  });
  document.getElementById('btn-cancel-modal').addEventListener('click', function() {
    document.getElementById('modal-new-ticket').classList.add('hidden');
  });
  document.getElementById('modal-new-ticket').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
  });

  document.getElementById('btn-create-ticket').addEventListener('click', async function() {
    var subject = document.getElementById('new-subject').value.trim();
    var desc = document.getElementById('new-description').value.trim();
    var errEl = document.getElementById('create-error');
    if (!subject || !desc) {
      errEl.textContent = 'Vui lòng nhập đầy đủ tiêu đề và mô tả.';
      errEl.classList.remove('hidden');
      return;
    }
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Đang gửi...';
    try {
      var ticket = await apiFetch('/api/support/tickets', {
        method: 'POST',
        body: JSON.stringify({ subject, description: desc }),
      });
      document.getElementById('modal-new-ticket').classList.add('hidden');
      document.getElementById('new-subject').value = '';
      document.getElementById('new-description').value = '';
      await loadTickets();
      if (ticket) openTicket(ticket);
    } catch(e) {
      errEl.textContent = 'Lỗi: ' + e.message;
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Gửi yêu cầu';
    }
  });

  // ─── Init ─────────────────────────────────────────────────
  await loadTickets();
})();
</script>
</body>
</html>
